<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Реєстрація — Coffee On The Way</title>
  <link rel="stylesheet" href="/test.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Bubbles&display=swap" rel="stylesheet">
   <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <svg style="position:absolute;width:0;height:0;pointer-events:none;">
  <filter id="smooth-wave">
    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.015"
      numOctaves="1" result="noise">
      <animate attributeName="baseFrequency" dur="15s"
        values="0.01 0.015; 0.012 0.025; 0.01 0.015"
        repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise"
      scale="15" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<h1 class="brand-logo">сoffee on the way</h1>
  <style>
    /* ── register.css або у style.css під селектором body.register-page ── */
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding-top: 80px;
}

.card {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 420px;
  background: rgba(186, 112, 66, 0.6);
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  border: 1px solid rgba(210, 197, 197, 0.18);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.07),
    0 0 50px rgba(200,130,60,0.15),
    0 24px 60px rgba(40,15,3,0.4);
  border-radius: 26px;
  padding: 40px 30px 30px;
  text-align: center;
  overflow: hidden;
}

/* блік */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    -45deg,
    rgba(255,255,255,0.12) 0%,
    rgba(255,255,255,0.03) 40%,
    rgba(0,0,0,0.10) 100%
  );
  pointer-events: none;
}

input, button {
  position: relative;
  z-index: 1;
}

input {
  width: 100%;
  margin-bottom: 12px;
  padding: 14px 20px;
  background: rgba(186, 112, 66, 0.35);
  border: 1px solid rgba(210, 197, 197, 0.18);
  border-radius: 50px;
  color: #f0e0cc;
  font-family: "Roboto Serif", Arial, serif;
  font-size: 0.88rem;
  outline: none;
  transition: filter 0.2s;
}

input:focus {
  filter: brightness(1.15);
}

input::placeholder {
  color: rgba(240, 224, 204, 0.45);
}

button[type="submit"] {
  width: 100%;
  padding: 14px 18px;
  margin-top: 8px;
  border-radius: 50px;
  background: rgba(186, 112, 66, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #f0e0cc;
  font-family: Roboto, Arial, sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: filter 0.2s, transform 0.15s;
  backdrop-filter: blur(18px);
}
.brand-logo {
  position: fixed;
  top: 26px;
  left: 40.5%;
  font-family: "Rubik Bubbles", system-ui;
  font-size: 23px;
  font-weight: 400;
  color: #e1dbca;
  transform: rotate(-10deg) skewX(-9deg);
  text-shadow: 4px 4px 4px rgba(0, 0, 0, 0.25);
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}
 .field-error.visible { display: block; }
 
    input.invalid { border-color: rgba(104, 4, 4, 0.6); }
button[type="submit"]:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
}


.link {
  margin-top: 20px;
  font-size: 0.85rem;
  cursor: pointer;
  color: #f0e0cc;
  opacity: 0.5;
  font-family: Roboto, Arial, sans-serif;
  transition: opacity 0.2s ease;
  background: none;
  border: none;
  width: auto;
  padding: 0;
  margin-top: 20px;
}
.brand-logo {
      zoom: 1.2;
      position: fixed;
      top: 26px;
      left: 40.5%;
      font-family: "Rubik Bubbles", system-ui;
      font-size: 23px;
      font-weight: 400;
      color: #e1dbca;
      transform: rotate(-10deg) skewX(-9deg);
      text-shadow: 4px 4px 4px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }
.link:hover {
  opacity: 1;
  background: none;
  border: none;
  transform: none;
  filter: none;
}
 .link-row {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: rgba(240,224,204,0.50);
      cursor: pointer;
      transition: color 0.2s;
    }
 .link-row:hover {
  color: rgba(240,224,204,0.90);
}

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #f0e0cc;
      margin-bottom: 22px;
      text-align: center;
      position: relative;
    }
    .field-error {
      font-size: 11px;
      color: #a04407;
      margin: 4px 30px 6px 14px;
      display: none;
    }
     .field-error.visible { display: block; }
     
  </style>
</head>
<body>
 
  <h1 class="brand-logo">сoffee on the way</h1>
 
  <div class="card">
    <p class="card-title">Реєстрація</p>
 
    <div class="input-group">
      <input id="regEmail" type="email" placeholder="Email" autocomplete="email">
      <span class="field-error" id="errEmail">Введіть коректний email</span>
    </div>
 
    <div class="input-group">
      <input id="regLogin" type="text" placeholder="Логін (нікнейм)" autocomplete="username">
      <span class="field-error" id="errLogin">Мінімум 3 символи</span>
    </div>
 
    <div class="input-group">
      <input id="regPassword" type="password" placeholder="Пароль" autocomplete="new-password">
      <span class="field-error" id="errPassword">Мінімум 6 символів</span>
    </div>
 
    <div class="input-group">
      <input id="regConfirm" type="password" placeholder="Повторіть пароль" autocomplete="new-password">
      <span class="field-error" id="errConfirm">Паролі не збігаються</span>
    </div>
 
    <button type="submit" id="regBtn">Зареєструватися</button>
 
    <p class="msg" id="regMsg"></p>
 
    <div class="link-row" onclick="window.location.href='/login.html'">
      Вже є акаунт? Увійти
    </div>
  </div>


<script>
 function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
    function show(id, visible) {
      const el = document.getElementById(id);
      el.classList.toggle('visible', visible);
    }
    function markInvalid(inputId, errId, invalid) {
      document.getElementById(inputId).classList.toggle('invalid', invalid);
      show(errId, invalid);
    }
 
    document.getElementById('regBtn').addEventListener('click', async () => {
      const email    = document.getElementById('regEmail').value.trim();
      const login    = document.getElementById('regLogin').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;
      const msg      = document.getElementById('regMsg');
 
      let valid = true;
 
      const emailBad = !validateEmail(email);
      markInvalid('regEmail', 'errEmail', emailBad);
      if (emailBad) valid = false;
 
      const loginBad = login.length < 3;
      markInvalid('regLogin', 'errLogin', loginBad);
      if (loginBad) valid = false;
 
      const passBad = password.length < 6;
      markInvalid('regPassword', 'errPassword', passBad);
      if (passBad) valid = false;
 
      const confirmBad = password !== confirm;
      markInvalid('regConfirm', 'errConfirm', confirmBad);
      if (confirmBad) valid = false;
 
      if (!valid) return;
 
      msg.textContent = '';
      msg.className = 'msg';
 
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password, gmail: email, name: login })
        });
        const data = await res.json();
 
        if (res.status === 409) {
          msg.textContent = 'Цей логін вже зайнятий.';
          msg.className = 'msg error';
          return;
        }
 
        if (data.userId) {
          localStorage.setItem('currentUser', JSON.stringify({ id: data.userId, login, email }));
          msg.textContent = 'Успішно! Переходимо...';
          msg.className = 'msg success';
          setTimeout(() => window.location.href = '/test', 1000);
        } else {
          msg.textContent = data.error || 'Помилка реєстрації.';
          msg.className = 'msg error';
        }
      } catch (e) {
        msg.textContent = 'Сервер не відповідає.';
        msg.className = 'msg error';
      }
    });
</script>
</body>
</html>
